name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Clone ThingsBoard fixture
        run: git clone --depth 1 https://github.com/thingsboard/thingsboard.git D:/AI/AI-Architecture-Discovery-Engine/thingsboard || true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --ignore=tests/test_mcp_server.py --ignore=tests/test_lineage_e2e_thingsboard.py

      - name: Run MCP server tests
        run: pytest tests/test_mcp_server.py -v

      - name: Run lineage e2e tests
        run: pytest tests/test_lineage_e2e_thingsboard.py -v --timeout=600
        continue-on-error: true
